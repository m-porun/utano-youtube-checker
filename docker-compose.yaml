services:
  app:
    build: .
    container_name: utano_youtube_checker
    volumes:
      - .:/app
    environment:
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
    tty: true
    stdin_open: true

  web:
    image: node:22-slim
    container_name: utano_web
    working_dir: /app/web
    volumes:
      - .:/app
    ports:
      - "5173:5173"
    tty: true
    stdin_open: true
    command: ["sleep", "infinity"]
